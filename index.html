<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orma Studio</title>
<meta name="description" content="Orma Studio édite des applications qui simplifient la France compliquée. Éditeur de MonLitige.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,540&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bleu: #1B3A5C;
    --creme: #F7F5F0;
    --or: #C8A45C;
    --encre: #22303C;
    --ardoise: #5A6B7D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--creme);
    color: var(--encre);
    font-family: 'Archivo', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.5rem;
    position: relative;
    overflow: hidden;
  }
  /* Le sillage : l'empreinte (orma) qui traverse la page */
  .sillage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .sillage path {
    fill: none;
    stroke: var(--or);
    stroke-width: 1.5;
    opacity: 0.55;
    stroke-dasharray: 2400;
    stroke-dashoffset: 2400;
    animation: tracer 2.8s ease-out 0.3s forwards;
  }
  @keyframes tracer { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .sillage path { animation: none; stroke-dashoffset: 0; }
  }
  .marque {
    font-family: 'Fraunces', serif;
    font-weight: 540;
    font-size: clamp(2.6rem, 8vw, 4.8rem);
    letter-spacing: 0.12em;
    color: var(--bleu);
    text-transform: uppercase;
    position: relative;
  }
  .marque .studio { color: var(--or); }
  .devise {
    margin-top: 1.4rem;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: var(--ardoise);
    max-width: 34ch;
    line-height: 1.6;
    position: relative;
  }
  .contact {
    margin-top: 3rem;
    position: relative;
  }
  .contact a {
    display: inline-block;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    color: var(--bleu);
    text-decoration: none;
    border: 1px solid var(--bleu);
    padding: 0.75rem 1.6rem;
    border-radius: 2rem;
    transition: background 0.2s, color 0.2s;
  }
  .contact a:hover, .contact a:focus-visible {
    background: var(--bleu);
    color: var(--creme);
    outline: none;
  }
  .contact a:focus-visible { box-shadow: 0 0 0 3px var(--or); }
  footer {
    padding: 1.5rem;
    text-align: center;
    font-size: 0.78rem;
    line-height: 1.7;
    color: var(--ardoise);
  }
  footer a { color: var(--ardoise); }
</style>
</head>
<body>
<main>
  <svg class="sillage" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M -50 470 C 250 430, 420 330, 600 300 C 780 270, 950 170, 1250 130" />
  </svg>
  <h1 class="marque">Orma<br><span class="studio">Studio</span></h1>
  <p class="devise">Des applications qui simplifient la France compliquée.</p>
  <div class="contact">
    <a href="mailto:contact@orma-studio.fr">contact@orma-studio.fr</a>
  </div>
</main>
<footer>
  Orma Studio, SASU au capital de 500 € - 107 393 316 RCS Paris<br>
  142 rue de Rivoli, 75001 Paris ·
  <a href="confidentialite.html">Politique de confidentialité de MonLitige</a>
</footer>
</body>
</html>
